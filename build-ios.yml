name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo project Xcode
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild \
            -project iPhoneMonitor.xcodeproj \
            -scheme iPhoneMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/iPhoneMonitor.app Payload/
          zip -r iPhoneMonitor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneMonitor-ipa
          path: iPhoneMonitor.ipa
