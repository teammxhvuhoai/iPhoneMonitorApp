name: iPhoneMonitor

options:
  bundleIdPrefix: com.iphonemonitor
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  iPhoneMonitor:
    type: application
    platform: iOS
    sources:
      - path: iPhoneMonitorApp
        excludes:
          - "Info-plist-keys.txt"
    info:
      path: iPhoneMonitorApp/Info.plist
      properties:
        CFBundleDisplayName: iPhone Monitor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Cho phép PC của bạn đọc thông số iPhone trong mạng nội bộ."
        NSBonjourServices:
          - _iphonemonitor._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iphonemonitor.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
