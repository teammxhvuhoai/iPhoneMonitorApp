name: Build iOS (IPA chưa ký)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Tìm thư mục iOS (chứa project.yml)
        run: |
          echo "=== Cấu trúc repo ==="
          find . -maxdepth 3 -not -path './.git/*' | sort
          FILE=$(find . -name project.yml -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::Không thấy file project.yml trong repo. Hãy đẩy cả thư mục iOS (gồm project.yml và iPhoneMonitorApp/*.swift) lên GitHub."
            exit 1
          fi
          DIR=$(cd "$(dirname "$FILE")" && pwd)
          echo "Tìm thấy: $DIR"
          echo "IOS_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo project Xcode từ project.yml
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Build (không ký)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          xcodebuild \
            -project iPhoneMonitor.xcodeproj \
            -scheme iPhoneMonitor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói IPA
        working-directory: ${{ env.IOS_DIR }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iPhoneMonitor.app Payload/
          zip -qry iPhoneMonitor-unsigned.ipa Payload

      - name: Tải IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneMonitor-unsigned-ipa
          path: ${{ env.IOS_DIR }}/iPhoneMonitor-unsigned.ipa
          if-no-files-found: error
